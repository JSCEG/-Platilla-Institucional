<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>SENER LaTeX - Dashboard</title>
<style>
body { margin:0; font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial; background:#fff; color:#222; }
.container { max-width:960px; margin:0 auto; padding:16px; }
.card { border:1px solid #ddd; border-radius:10px; padding:18px; box-shadow:0 2px 6px rgba(0,0,0,0.08); }
.row { display:flex; gap:12px; flex-wrap:wrap; }
.btn { border:1px solid #ddd; border-radius:8px; padding:10px 14px; background:#fff; cursor:pointer; }
.btn.primary { border-color:#7D1128; background:#7D1128; color:#fff; }
.muted { color:#666; }
</style>
</head>
<body>
<div class="container">
  <div class="card">
    <h1>SENER LaTeX</h1>
    <p class="muted">Usa el menú de la hoja o abre el editor web.</p>
    <div class="row">
      <button class="btn primary" onclick="window.open('?page=editor','_blank')">Abrir Editor</button>
    </div>
  </div>
 </div>
</body>
</html>
