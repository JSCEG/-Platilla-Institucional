<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SENER LaTeX Editor</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;700&display=swap" rel="stylesheet">
  <script>
    var state = { selection: null };
    function saveSelection() {
      var sel = window.getSelection();
      if (!sel || sel.rangeCount === 0) return;
      state.selection = sel.getRangeAt(0);
    }
    function restoreSelection() {
      if (!state.selection) return;
      var sel = window.getSelection();
      sel.removeAllRanges();
      sel.addRange(state.selection);
    }
    function execFormat(cmd) {
      restoreSelection();
      document.execCommand(cmd, false, null);
      saveSelection();
    }
    function openNoteModal() {
      saveSelection();
      document.getElementById('note-modal').style.display = 'flex';
      document.getElementById('note-text').focus();
      updateNotePreview();
    }
    function closeNoteModal() {
      document.getElementById('note-modal').style.display = 'none';
    }
    function insertLatexInNote() {
      var input = document.getElementById('latex-input');
      var ta = document.getElementById('note-text');
      var start = ta.selectionStart;
      var end = ta.selectionEnd;
      var value = ta.value;
      var latex = input.value || '';
      if (!latex) return;
      var insertion = '$' + latex + '$';
      ta.value = value.slice(0, start) + insertion + value.slice(end);
      ta.selectionStart = ta.selectionEnd = start + insertion.length;
      updateNotePreview();
      input.value = '';
    }
    function updateNotePreview() {
      var raw = document.getElementById('note-text').value || '';
      var preview = document.getElementById('note-preview');
      preview.textContent = raw;
      if (window.MathJax && window.MathJax.typesetPromise) {
        MathJax.typesetClear([preview]);
        MathJax.typesetPromise([preview]);
      }
    }
    function validateNoteContent(text) {
      if (!text) return { ok: false, reason: 'Vacía' };
      var t = text.trim();
      if (t.length === 0) return { ok: false, reason: 'Solo espacios' };
      return { ok: true, reason: '' };
    }
    function confirmNote() {
      var text = document.getElementById('note-text').value || '';
      var v = validateNoteContent(text);
      if (!v.ok) {
        alert('Contenido de la nota inválido: ' + v.reason);
        return;
      }
      var tag = '[[nota:' + text.replace(/\n/g, ' ') + ']]';
      closeNoteModal();
      restoreSelection();
      if (state.selection) {
        var span = document.createElement('span');
        span.textContent = tag;
        state.selection.deleteContents();
        state.selection.insertNode(span);
      } else {
        document.getElementById('content-editor').appendChild(document.createTextNode(tag));
      }
      renderEditorPreview();
      document.dispatchEvent(new CustomEvent('nota-insertada', { detail: { content: text } }));
    }
    function cancelNote() {
      closeNoteModal();
    }
    function renderEditorPreview() {
      var editor = document.getElementById('content-editor');
      if (window.MathJax && window.MathJax.typesetPromise) {
        MathJax.typesetClear([editor]);
        MathJax.typesetPromise([editor]);
      }
    }
    function initToolbar() {
      document.getElementById('btn-bold').addEventListener('click', function () { execFormat('bold'); });
      document.getElementById('btn-italic').addEventListener('click', function () { execFormat('italic'); });
      document.getElementById('btn-insert-note').addEventListener('click', openNoteModal);
    }
    function initModal() {
      document.getElementById('note-text').addEventListener('input', updateNotePreview);
      document.getElementById('btn-insert-latex').addEventListener('click', insertLatexInNote);
      document.getElementById('btn-accept').addEventListener('click', confirmNote);
      document.getElementById('btn-cancel').addEventListener('click', cancelNote);
    }
    function wrapSelectionInTextarea(textarea, before, after) {
      var start = textarea.selectionStart;
      var end = textarea.selectionEnd;
      var value = textarea.value;
      var sel = value.slice(start, end);
      if (!sel) return;
      var replaced = before + sel + after;
      textarea.value = value.slice(0, start) + replaced + value.slice(end);
      textarea.selectionStart = start;
      textarea.selectionEnd = start + replaced.length;
    }
    function formatNoteBold() {
      var ta = document.getElementById('note-text');
      wrapSelectionInTextarea(ta, '\\textbf{', '}');
      updateNotePreview();
    }
    function formatNoteItalic() {
      var ta = document.getElementById('note-text');
      wrapSelectionInTextarea(ta, '\\textit{', '}');
      updateNotePreview();
    }
    function initPersistence() {
      document.getElementById('btn-save').addEventListener('click', function () {
        var content = document.getElementById('content-editor').innerText || '';
        if (google && google.script && google.script.run && google.script.run.guardarDocumento) {
          var docIdEl = document.getElementById('doc-id');
          var docId = docIdEl ? docIdEl.value : '';
          var payload = { metadata: { Contenido: content } };
          google.script.run
            .withSuccessHandler(function () { alert('Guardado'); })
            .withFailureHandler(function (e) { alert('Error al guardar: ' + e); })
            .guardarDocumento(docId, payload);
        } else {
          alert('Guardado local no disponible');
        }
      });
    }
    function initEditor() {
      initToolbar();
      initModal();
      initPersistence();
      document.getElementById('content-editor').addEventListener('keyup', saveSelection);
      document.getElementById('content-editor').addEventListener('mouseup', saveSelection);
    }
    document.addEventListener('DOMContentLoaded', initEditor);
  </script>
  <script>
    window.MathJax = {
      tex: { inlineMath: [['$', '$'], ['\\(', '\\)']] },
      svg: { fontCache: 'global' }
    };
  </script>
  <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" defer></script>
  <style>
    :root {
      --bg: #fff;
      --fg: #222;
      --accent: #7D1128;
      --muted: #666;
      --border: #ddd;
      --shadow: rgba(0, 0, 0, 0.08);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: "Noto Sans", system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, "Apple Color Emoji", "Segoe UI Emoji";
      background: var(--bg);
      color: var(--fg);
    }

    .container {
      max-width: 1100px;
      margin: 0 auto;
      padding: 16px;
    }

    .toolbar {
      display: flex;
      gap: 8px;
      align-items: center;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px;
      background: #fafafa;
      box-shadow: 0 2px 6px var(--shadow);
    }

    .toolbar button {
      border: 1px solid var(--border);
      background: #fff;
      border-radius: 6px;
      padding: 8px 12px;
      cursor: pointer;
    }

    .toolbar button.primary {
      border-color: var(--accent);
      color: #fff;
      background: var(--accent);
    }

    .editor {
      margin-top: 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      min-height: 240px;
      padding: 12px;
      background: #fff;
      box-shadow: 0 2px 6px var(--shadow);
    }

    .statusbar {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      margin-top: 12px;
    }

    .statusbar button {
      border: 1px solid var(--border);
      background: #fff;
      border-radius: 6px;
      padding: 8px 12px;
      cursor: pointer;
    }

    .modal {
      position: fixed;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      background: rgba(0, 0, 0, 0.35);
      z-index: 1000;
    }

    .modal-card {
      width: min(680px, 92vw);
      background: #fff;
      border-radius: 10px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.25);
      display: flex;
      flex-direction: column;
    }

    .modal-header {
      padding: 14px 16px;
      border-bottom: 1px solid var(--border);
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .modal-body {
      padding: 14px 16px;
      display: grid;
      grid-template-columns: 1fr;
      gap: 12px;
    }

    .note-toolbar {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .note-toolbar button {
      border: 1px solid var(--border);
      background: #fff;
      border-radius: 6px;
      padding: 6px 10px;
      cursor: pointer;
    }

    .note-area {
      width: 100%;
      min-height: 140px;
      resize: vertical;
      padding: 10px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-family: inherit;
    }

    .latex-row {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .latex-row input {
      flex: 1;
      padding: 8px;
      border: 1px solid var(--border);
      border-radius: 8px;
    }

    .preview {
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px;
      min-height: 80px;
      background: #fafafa;
      font-size: 0.95rem;
      color: var(--muted);
    }

    .modal-footer {
      padding: 14px 16px;
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: flex-end;
      gap: 8px;
    }

    .modal-footer button {
      border: 1px solid var(--border);
      background: #fff;
      border-radius: 6px;
      padding: 8px 12px;
      cursor: pointer;
    }

    .modal-footer button.primary {
      border-color: var(--accent);
      color: #fff;
      background: var(--accent);
    }

    @media (max-width:640px) {
      .latex-row {
        flex-direction: column;
      }
    }
  </style>
</head>

<body>
  <div class="container">
    <div class="toolbar">
      <button id="btn-bold" title="Negrita"><b>B</b></button>
      <button id="btn-italic" title="Cursiva"><i>I</i></button>
      <button id="btn-insert-note" class="primary" title="Insertar nota">Insertar nota</button>
    </div>
    <div id="content-editor" class="editor" contenteditable="true"></div>
    <div class="statusbar">
      <input type="text" id="doc-id" placeholder="ID documento"
        style="border:1px solid var(--border); border-radius:6px; padding:8px 10px;" />
      <button id="btn-save">Guardar</button>
    </div>
  </div>
  <div id="note-modal" class="modal" role="dialog" aria-modal="true">
    <div class="modal-card">
      <div class="modal-header">
        <div>Insertar nota</div>
        <button onclick="closeNoteModal()">✕</button>
      </div>
      <div class="modal-body">
        <div class="note-toolbar">
          <button onclick="formatNoteBold()">Negrita</button>
          <button onclick="formatNoteItalic()">Cursiva</button>
        </div>
        <textarea id="note-text" class="note-area" placeholder="Contenido de la nota"></textarea>
        <div class="latex-row">
          <input id="latex-input" type="text" placeholder="Expresión LaTeX (ej. E=mc^2)" />
          <button id="btn-insert-latex">Insertar LaTeX</button>
        </div>
        <div id="note-preview" class="preview"></div>
      </div>
      <div class="modal-footer">
        <button id="btn-cancel">Cancelar</button>
        <button id="btn-accept" class="primary">Aceptar</button>
      </div>
    </div>
  </div>
</body>

</html>
