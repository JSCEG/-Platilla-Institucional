<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Rápido - Editor</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        .success { color: green; }
        .error { color: red; }
        .info { color: blue; }
    </style>
</head>
<body>
    <h1>🧪 Test Rápido del Editor</h1>
    
    <div id="results">
        <p>Ejecutando pruebas...</p>
    </div>
    
    <div style="margin-top: 20px;">
        <a href="editor.html?id=D01" target="_blank" style="background: #007bff; color: white; padding: 10px 20px; text-decoration: none; border-radius: 5px;">
            🚀 Probar Editor con D01
        </a>
        
        <a href="editor.html?nuevo=true" target="_blank" style="background: #28a745; color: white; padding: 10px 20px; text-decoration: none; border-radius: 5px; margin-left: 10px;">
            ➕ Probar Editor Nuevo
        </a>
    </div>

    <script>
        // Test básico de elementos
        function testElements() {
            const results = document.getElementById('results');
            let html = '<h3>📋 Resultados de Pruebas:</h3>';
            
            // Simular carga del editor.html
            const iframe = document.createElement('iframe');
            iframe.src = 'editor.html?nuevo=true';
            iframe.style.display = 'none';
            document.body.appendChild(iframe);
            
            iframe.onload = function() {
                try {
                    const doc = iframe.contentDocument;
                    
                    // Verificar elementos clave
                    const tests = [
                        { name: 'figuras-tbody', element: doc.getElementById('figuras-tbody') },
                        { name: 'figuras-empty-state', element: doc.getElementById('figuras-empty-state') },
                        { name: 'secciones-lista', element: doc.getElementById('secciones-lista') },
                        { name: 'tablas-lista', element: doc.getElementById('tablas-lista') },
                        { name: 'bibliografia-lista', element: doc.getElementById('bibliografia-lista') },
                        { name: 'siglas-lista', element: doc.getElementById('siglas-lista') },
                        { name: 'glosario-lista', element: doc.getElementById('glosario-lista') }
                    ];
                    
                    tests.forEach(test => {
                        const status = test.element ? 'success' : 'error';
                        const icon = test.element ? '✅' : '❌';
                        html += `<p class="${status}">${icon} ${test.name}: ${test.element ? 'Encontrado' : 'No encontrado'}</p>`;
                    });
                    
                    results.innerHTML = html;
                    
                } catch (error) {
                    results.innerHTML = `<p class="error">❌ Error al acceder al iframe: ${error.message}</p>`;
                }
                
                // Limpiar iframe
                setTimeout(() => {
                    document.body.removeChild(iframe);
                }, 1000);
            };
            
            iframe.onerror = function() {
                results.innerHTML = '<p class="error">❌ Error al cargar editor.html</p>';
            };
        }
        
        // Ejecutar test después de un momento
        setTimeout(testElements, 1000);
    </script>
</body>
</html>
