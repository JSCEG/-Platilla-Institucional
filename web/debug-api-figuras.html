<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Debug API Figuras - SENER LaTeX</title>
    
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        .debug-section {
            border: 1px solid #dee2e6;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
            background: #f8f9fa;
        }
        .debug-output {
            background: #2d2d2d;
            color: #f8f8f2;
            padding: 15px;
            border-radius: 5px;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            max-height: 300px;
            overflow-y: auto;
            white-space: pre-wrap;
        }
        .status-badge {
            font-size: 0.8rem;
            padding: 4px 8px;
        }
    </style>
</head>
<body>
    <div class="container mt-4">
        <div class="row">
            <div class="col-12">
                <h1 class="text-center mb-4">
                    <i class="fas fa-bug me-2 text-danger"></i>
                    Debug API de Figuras
                </h1>
                
                <!-- Estado de Configuración -->
                <div class="debug-section">
                    <h5><i class="fas fa-cog me-2"></i>Estado de Configuración</h5>
                    <div id="config-status">
                        <div class="text-center">
                            <div class="spinner-border spinner-border-sm text-primary" role="status"></div>
                            <span class="ms-2">Verificando...</span>
                        </div>
                    </div>
                </div>
                
                <!-- Controles de Prueba -->
                <div class="debug-section">
                    <h5><i class="fas fa-play me-2"></i>Pruebas de API</h5>
                    <div class="row">
                        <div class="col-md-3">
                            <button class="btn btn-primary w-100 mb-2" onclick="probarConexionDirecta()">
                                <i class="fas fa-link me-1"></i>
                                Conexión Directa
                            </button>
                        </div>
                        <div class="col-md-3">
                            <button class="btn btn-success w-100 mb-2" onclick="probarCrearFiguraDebug()">
                                <i class="fas fa-plus me-1"></i>
                                Crear Figura
                            </button>
                        </div>
                        <div class="col-md-3">
                            <button class="btn btn-warning w-100 mb-2" onclick="probarActualizarFiguraDebug()">
                                <i class="fas fa-edit me-1"></i>
                                Actualizar Figura
                            </button>
                        </div>
                        <div class="col-md-3">
                            <button class="btn btn-danger w-100 mb-2" onclick="probarEliminarFiguraDebug()">
                                <i class="fas fa-trash me-1"></i>
                                Eliminar Figura
                            </button>
                        </div>
                    </div>
                    <div class="row mt-2">
                        <div class="col-md-6">
                            <button class="btn btn-info w-100 mb-2" onclick="listarFigurasActuales()">
                                <i class="fas fa-list me-1"></i>
                                Listar Figuras Actuales
                            </button>
                        </div>
                        <div class="col-md-6">
                            <button class="btn btn-secondary w-100 mb-2" onclick="limpiarDebug()">
                                <i class="fas fa-broom me-1"></i>
                                Limpiar Debug
                            </button>
                        </div>
                    </div>
                </div>
                
                <!-- Output de Debug -->
                <div class="debug-section">
                    <h5><i class="fas fa-terminal me-2"></i>Output de Debug</h5>
                    <div id="debug-output" class="debug-output">
                        Esperando comandos de debug...
                    </div>
                </div>
                
                <!-- Navegación -->
                <div class="text-center mt-4">
                    <a href="test-figuras.html" class="btn btn-outline-primary me-2">
                        <i class="fas fa-vial me-1"></i>
                        Test Figuras Normal
                    </a>
                    <a href="editor.html?id=D01" class="btn btn-outline-success me-2">
                        <i class="fas fa-edit me-1"></i>
                        Editor (D01)
                    </a>
                    <a href="index.html" class="btn btn-outline-secondary">
                        <i class="fas fa-home me-1"></i>
                        Inicio
                    </a>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- Scripts necesarios -->
    <script src="js/config.js"></script>
    <script src="js/api.js"></script>
    
    <script>
        // Variables globales para debug
        let debugLog = [];
        
        // Ejecutar verificación automática al cargar
        document.addEventListener('DOMContentLoaded', async function() {
            await verificarConfiguracionDebug();
        });
        
        function log(mensaje, tipo = 'info') {
            const timestamp = new Date().toLocaleTimeString();
            const entry = `[${timestamp}] [${tipo.toUpperCase()}] ${mensaje}`;
            debugLog.push(entry);
            
            const output = document.getElementById('debug-output');
            output.textContent = debugLog.join('\\n');
            output.scrollTop = output.scrollHeight;
            
            console.log(entry);
        }
        
        async function verificarConfiguracionDebug() {
            const statusDiv = document.getElementById('config-status');
            
            try {
                let html = '';
                
                // 1. CONFIG
                const configOk = typeof CONFIG !== 'undefined';
                html += `<span class="badge status-badge ${configOk ? 'bg-success' : 'bg-danger'}">CONFIG: ${configOk ? 'OK' : 'FALTA'}</span> `;
                
                // 2. API
                const apiOk = typeof api !== 'undefined';
                html += `<span class="badge status-badge ${apiOk ? 'bg-success' : 'bg-danger'}">API: ${apiOk ? 'OK' : 'FALTA'}</span> `;
                
                // 3. URL de Figuras
                const urlFiguras = CONFIG?.APPS_SCRIPT_URLS?.FIGURAS;
                const urlOk = !!urlFiguras;
                html += `<span class="badge status-badge ${urlOk ? 'bg-success' : 'bg-danger'}">URL FIGURAS: ${urlOk ? 'OK' : 'FALTA'}</span><br>`;
                
                if (urlOk) {
                    html += `<small class="text-muted">URL: ${urlFiguras}</small>`;
                }
                
                statusDiv.innerHTML = html;
                
                log('Configuración verificada');
                log(`CONFIG: ${configOk}`);
                log(`API: ${apiOk}`);
                log(`URL Figuras: ${urlOk}`);
                if (urlOk) log(`URL: ${urlFiguras}`);
                
            } catch (error) {
                statusDiv.innerHTML = `<span class="badge bg-danger">ERROR: ${error.message}</span>`;
                log(`Error en verificación: ${error.message}`, 'error');
            }
        }
        
        async function probarConexionDirecta() {
            log('=== PRUEBA DE CONEXIÓN DIRECTA ===');
            
            try {
                const url = CONFIG.APPS_SCRIPT_URLS.FIGURAS;
                if (!url) {
                    throw new Error('URL de figuras no configurada');
                }
                
                log(`Conectando a: ${url}`);
                
                const payload = {
                    action: 'TEST_CONNECTION',
                    timestamp: new Date().toISOString()
                };
                
                log(`Enviando payload: ${JSON.stringify(payload, null, 2)}`);
                
                const response = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify(payload)
                });
                
                log(`Respuesta HTTP: ${response.status} ${response.statusText}`);
                
                const text = await response.text();
                log(`Respuesta raw: ${text}`);
                
                try {
                    const json = JSON.parse(text);
                    log(`Respuesta JSON: ${JSON.stringify(json, null, 2)}`);
                } catch (e) {
                    log(`No es JSON válido: ${e.message}`, 'warn');
                }
                
            } catch (error) {
                log(`Error en conexión directa: ${error.message}`, 'error');
                log(`Stack: ${error.stack}`, 'error');
            }
        }
        
        async function probarCrearFiguraDebug() {
            log('=== PRUEBA DE CREAR FIGURA ===');
            
            try {
                const figuraTest = {
                    SeccionOrden: '99',
                    OrdenFigura: '888',
                    Caption: 'DEBUG - Figura de prueba',
                    RutaArchivo: 'img/debug/test.png',
                    Fuente: 'Debug - ' + new Date().toLocaleString()
                };
                
                log(`Creando figura: ${JSON.stringify(figuraTest, null, 2)}`);
                
                const resultado = await api.crearFigura('DEBUG', figuraTest);
                
                log(`Resultado: ${JSON.stringify(resultado, null, 2)}`);
                
                if (resultado.status === 'success') {
                    log('✅ Figura creada exitosamente', 'success');
                } else {
                    log(`⚠️ Respuesta inesperada: ${resultado.message}`, 'warn');
                }
                
            } catch (error) {
                log(`❌ Error al crear figura: ${error.message}`, 'error');
                log(`Stack: ${error.stack}`, 'error');
            }
        }
        
        async function probarActualizarFiguraDebug() {
            log('=== PRUEBA DE ACTUALIZAR FIGURA ===');
            
            try {
                const figuraId = '99-888';
                const figuraActualizada = {
                    SeccionOrden: '99',
                    OrdenFigura: '888',
                    Caption: 'DEBUG - Figura ACTUALIZADA',
                    RutaArchivo: 'img/debug/test_updated.png',
                    Fuente: 'Debug Actualizado - ' + new Date().toLocaleString()
                };
                
                log(`Actualizando figura ID: ${figuraId}`);
                log(`Datos: ${JSON.stringify(figuraActualizada, null, 2)}`);
                
                const resultado = await api.actualizarFigura('DEBUG', figuraId, figuraActualizada);
                
                log(`Resultado: ${JSON.stringify(resultado, null, 2)}`);
                
                if (resultado.status === 'success') {
                    log('✅ Figura actualizada exitosamente', 'success');
                } else {
                    log(`⚠️ Respuesta inesperada: ${resultado.message}`, 'warn');
                }
                
            } catch (error) {
                log(`❌ Error al actualizar figura: ${error.message}`, 'error');
                log(`Stack: ${error.stack}`, 'error');
            }
        }
        
        async function probarEliminarFiguraDebug() {
            log('=== PRUEBA DE ELIMINAR FIGURA ===');
            
            try {
                const figuraId = '99-888';
                
                log(`Eliminando figura ID: ${figuraId}`);
                
                const resultado = await api.eliminarFigura('DEBUG', figuraId);
                
                log(`Resultado: ${JSON.stringify(resultado, null, 2)}`);
                
                if (resultado.status === 'success') {
                    log('✅ Figura eliminada exitosamente', 'success');
                } else {
                    log(`⚠️ Respuesta inesperada: ${resultado.message}`, 'warn');
                }
                
            } catch (error) {
                log(`❌ Error al eliminar figura: ${error.message}`, 'error');
                log(`Stack: ${error.stack}`, 'error');
            }
        }
        
        async function listarFigurasActuales() {
            log('=== LISTADO DE FIGURAS ACTUALES ===');
            
            try {
                const figuras = await cargarHojaCSV('Figuras');
                
                log(`Total de figuras encontradas: ${figuras.length}`);
                
                if (figuras.length > 0) {
                    figuras.forEach((figura, index) => {
                        log(`[${index + 1}] DocID: ${figura.DocumentoID}, Sec: ${figura.SeccionOrden}, Ord: ${figura.OrdenFigura}, Título: ${figura.Caption}`);
                    });
                } else {
                    log('No se encontraron figuras');
                }
                
            } catch (error) {
                log(`❌ Error al listar figuras: ${error.message}`, 'error');
            }
        }
        
        function limpiarDebug() {
            debugLog = [];
            document.getElementById('debug-output').textContent = 'Debug limpiado...';
            log('Debug reiniciado');
        }
    </script>
</body>
</html>
