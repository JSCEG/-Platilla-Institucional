<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Debug - Datos del Google Sheets</title>
    <style>
        body {
            font-family: 'Courier New', monospace;
            max-width: 1400px;
            margin: 20px auto;
            padding: 20px;
            background: #1e1e1e;
            color: #d4d4d4;
        }
        h1 {
            color: #4ec9b0;
            border-bottom: 2px solid #4ec9b0;
            padding-bottom: 10px;
        }
        h2 {
            color: #dcdcaa;
            margin-top: 30px;
        }
        .section {
            background: #252526;
            padding: 20px;
            margin: 20px 0;
            border-radius: 5px;
            border-left: 4px solid #007acc;
        }
        .raw-data {
            background: #1e1e1e;
            padding: 15px;
            border-radius: 5px;
            overflow-x: auto;
            white-space: pre-wrap;
            word-wrap: break-word;
            max-height: 400px;
            overflow-y: auto;
            border: 1px solid #3c3c3c;
        }
        .doc-card {
            background: #2d2d30;
            padding: 15px;
            margin: 10px 0;
            border-radius: 5px;
            border-left: 4px solid #569cd6;
        }
        .doc-card h3 {
            margin: 0 0 10px 0;
            color: #569cd6;
        }
        .doc-field {
            margin: 5px 0;
            padding: 5px;
            background: #1e1e1e;
            border-radius: 3px;
        }
        .field-name {
            color: #9cdcfe;
            font-weight: bold;
        }
        .field-value {
            color: #ce9178;
        }
        .empty {
            color: #858585;
            font-style: italic;
        }
        button {
            background: #007acc;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            margin: 5px;
        }
        button:hover {
            background: #005a9e;
        }
        .warning {
            background: #433419;
            border-left-color: #dcdcaa;
            color: #dcdcaa;
        }
        .error {
            background: #3f1f1f;
            border-left-color: #f48771;
            color: #f48771;
        }
        .success {
            background: #1e3a1e;
            border-left-color: #4ec9b0;
            color: #4ec9b0;
        }
    </style>
</head>
<body>
    <h1>🔍 Debug - Datos del Google Sheets</h1>
    
    <div>
        <button onclick="cargarYMostrar()">🔄 Cargar Datos</button>
        <button onclick="limpiar()">🗑️ Limpiar</button>
    </div>
    
    <div id="resultado"></div>
    
    <script src="js/config.js"></script>
    <script>
        async function cargarYMostrar() {
            const resultado = document.getElementById('resultado');
            resultado.innerHTML = '<div class="section">⏳ Cargando datos...</div>';
            
            try {
                // Cargar hoja de Documentos
                const documentos = await cargarHojaCSV('Documentos');
                
                let html = `
                    <div class="section success">
                        <h2>✅ Datos Cargados Exitosamente</h2>
                        <p>Total de filas: <strong>${documentos.length}</strong></p>
                    </div>
                `;
                
                // Mostrar cada documento
                html += '<div class="section"><h2>📄 Documentos Encontrados</h2>';
                
                documentos.forEach((doc, index) => {
                    const tieneID = doc.ID && doc.ID.trim() !== '';
                    const tieneTitulo = doc.Titulo && doc.Titulo.trim() !== '';
                    const esValido = tieneID && tieneTitulo;
                    
                    html += `
                        <div class="doc-card ${!esValido ? 'warning' : ''}">
                            <h3>Fila ${index + 2} ${!esValido ? '⚠️ INVÁLIDO' : '✅'}</h3>
                            ${Object.keys(doc).map(key => {
                                const value = doc[key];
                                const isEmpty = !value || value.trim() === '';
                                return `
                                    <div class="doc-field">
                                        <span class="field-name">${key}:</span>
                                        <span class="field-value ${isEmpty ? 'empty' : ''}">
                                            ${isEmpty ? '(vacío)' : value}
                                        </span>
                                    </div>
                                `;
                            }).join('')}
                        </div>
                    `;
                });
                
                html += '</div>';
                
                // Mostrar datos RAW
                html += `
                    <div class="section">
                        <h2>📋 Datos RAW (JSON)</h2>
                        <div class="raw-data">${JSON.stringify(documentos, null, 2)}</div>
                    </div>
                `;
                
                // Análisis
                const validos = documentos.filter(d => d.ID && d.ID.trim() && d.Titulo && d.Titulo.trim());
                const invalidos = documentos.length - validos.length;
                
                html += `
                    <div class="section ${invalidos > 0 ? 'warning' : 'success'}">
                        <h2>📊 Análisis</h2>
                        <p>✅ Documentos válidos: <strong>${validos.length}</strong></p>
                        <p>⚠️ Documentos inválidos: <strong>${invalidos}</strong></p>
                        ${invalidos > 0 ? '<p>Los documentos inválidos no tienen ID o Título y serán ignorados.</p>' : ''}
                    </div>
                `;
                
                resultado.innerHTML = html;
                
            } catch (error) {
                resultado.innerHTML = `
                    <div class="section error">
                        <h2>❌ Error al Cargar Datos</h2>
                        <p>${error.message}</p>
                        <div class="raw-data">${error.stack}</div>
                    </div>
                `;
            }
        }
        
        function limpiar() {
            document.getElementById('resultado').innerHTML = '';
        }
        
        // Cargar automáticamente al abrir
        window.addEventListener('load', cargarYMostrar);
    </script>
</body>
</html>
