<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test API Real - SENER LaTeX</title>
    
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        .debug-output {
            background: #2d2d2d;
            color: #f8f8f2;
            padding: 15px;
            border-radius: 5px;
            font-family: 'Courier New', monospace;
            font-size: 11px;
            max-height: 500px;
            overflow-y: auto;
            white-space: pre-wrap;
        }
    </style>
</head>
<body>
    <div class="container mt-4">
        <div class="row">
            <div class="col-12">
                <h1 class="text-center mb-4">
                    <i class="fas fa-satellite-dish me-2 text-primary"></i>
                    Test API Real - Diagnóstico Completo
                </h1>
                
                <!-- Estado de Configuración -->
                <div class="card mb-4">
                    <div class="card-header">
                        <h5 class="mb-0">
                            <i class="fas fa-info-circle me-2"></i>
                            Estado de Configuración
                        </h5>
                    </div>
                    <div class="card-body">
                        <div id="config-info">Verificando...</div>
                    </div>
                </div>
                
                <!-- Pruebas Paso a Paso -->
                <div class="card mb-4">
                    <div class="card-header">
                        <h5 class="mb-0">
                            <i class="fas fa-list-ol me-2"></i>
                            Pruebas Paso a Paso
                        </h5>
                    </div>
                    <div class="card-body">
                        <div class="row">
                            <div class="col-md-3">
                                <button class="btn btn-outline-primary w-100 mb-2" onclick="paso1_verificarURL()">
                                    1. Verificar URL
                                </button>
                            </div>
                            <div class="col-md-3">
                                <button class="btn btn-outline-info w-100 mb-2" onclick="paso2_probarConexion()">
                                    2. Probar Conexión
                                </button>
                            </div>
                            <div class="col-md-3">
                                <button class="btn btn-outline-success w-100 mb-2" onclick="paso3_crearFigura()">
                                    3. Crear Figura
                                </button>
                            </div>
                            <div class="col-md-3">
                                <button class="btn btn-outline-warning w-100 mb-2" onclick="paso4_verificarCreacion()">
                                    4. Verificar Creación
                                </button>
                            </div>
                        </div>
                        <div class="row mt-2">
                            <div class="col-md-4">
                                <button class="btn btn-outline-danger w-100 mb-2" onclick="paso5_actualizarFigura()">
                                    5. Actualizar Figura
                                </button>
                            </div>
                            <div class="col-md-4">
                                <button class="btn btn-outline-dark w-100 mb-2" onclick="paso6_eliminarFigura()">
                                    6. Eliminar Figura
                                </button>
                            </div>
                            <div class="col-md-4">
                                <button class="btn btn-secondary w-100 mb-2" onclick="limpiarLog()">
                                    <i class="fas fa-broom me-1"></i>
                                    Limpiar
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
                
                <!-- Log de Debug -->
                <div class="card">
                    <div class="card-header">
                        <h5 class="mb-0">
                            <i class="fas fa-terminal me-2"></i>
                            Log de Debug Detallado
                        </h5>
                    </div>
                    <div class="card-body p-0">
                        <div id="debug-log" class="debug-output">
                            Esperando comandos...
                        </div>
                    </div>
                </div>
                
                <div class="text-center mt-4">
                    <a href="editor.html?id=D01" class="btn btn-primary me-2">
                        <i class="fas fa-edit me-1"></i>
                        Ir al Editor
                    </a>
                    <a href="index.html" class="btn btn-secondary">
                        <i class="fas fa-home me-1"></i>
                        Inicio
                    </a>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- Scripts necesarios -->
    <script src="js/config.js"></script>
    <script src="js/api.js"></script>
    
    <script>
        let logEntries = [];
        
        function log(mensaje, nivel = 'INFO') {
            const timestamp = new Date().toISOString();
            const entry = `[${timestamp}] [${nivel}] ${mensaje}`;
            logEntries.push(entry);
            
            const logDiv = document.getElementById('debug-log');
            logDiv.textContent = logEntries.join('\\n');
            logDiv.scrollTop = logDiv.scrollHeight;
            
            console.log(entry);
        }
        
        function limpiarLog() {
            logEntries = [];
            document.getElementById('debug-log').textContent = 'Log limpiado...';
        }
        
        // Verificar configuración al cargar
        document.addEventListener('DOMContentLoaded', function() {
            verificarConfiguracion();
        });
        
        function verificarConfiguracion() {
            const configDiv = document.getElementById('config-info');
            let html = '';
            
            // CONFIG
            const configOk = typeof CONFIG !== 'undefined';
            html += `<span class="badge ${configOk ? 'bg-success' : 'bg-danger'}">${configOk ? '✅' : '❌'} CONFIG</span> `;
            
            // API
            const apiOk = typeof api !== 'undefined';
            html += `<span class="badge ${apiOk ? 'bg-success' : 'bg-danger'}">${apiOk ? '✅' : '❌'} API</span> `;
            
            // URL Figuras
            const urlFiguras = CONFIG?.APPS_SCRIPT_URLS?.FIGURAS;
            const urlOk = !!urlFiguras;
            html += `<span class="badge ${urlOk ? 'bg-success' : 'bg-danger'}">${urlOk ? '✅' : '❌'} URL FIGURAS</span><br>`;
            
            if (urlOk) {
                html += `<small class="text-muted mt-2 d-block"><strong>URL:</strong> ${urlFiguras}</small>`;
            }
            
            configDiv.innerHTML = html;
            
            log('=== VERIFICACIÓN DE CONFIGURACIÓN ===');
            log(`CONFIG disponible: ${configOk}`);
            log(`API disponible: ${apiOk}`);
            log(`URL Figuras configurada: ${urlOk}`);
            if (urlOk) log(`URL: ${urlFiguras}`);
        }
        
        function paso1_verificarURL() {
            log('=== PASO 1: VERIFICAR URL ===');
            
            const url = CONFIG?.APPS_SCRIPT_URLS?.FIGURAS;
            if (!url) {
                log('❌ URL de figuras no configurada', 'ERROR');
                return;
            }
            
            log(`✅ URL encontrada: ${url}`);
            log('Verificando formato de URL...');
            
            if (url.includes('script.google.com') && url.includes('/exec')) {
                log('✅ Formato de URL correcto (Google Apps Script)');
            } else {
                log('⚠️ Formato de URL sospechoso', 'WARN');
            }
        }
        
        async function paso2_probarConexion() {
            log('=== PASO 2: PROBAR CONEXIÓN BÁSICA ===');
            
            try {
                const url = CONFIG.APPS_SCRIPT_URLS.FIGURAS;
                log(`Conectando a: ${url}`);
                
                const payload = {
                    action: 'TEST_CONNECTION',
                    timestamp: new Date().toISOString()
                };
                
                log(`Enviando payload: ${JSON.stringify(payload)}`);
                
                const response = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify(payload)
                });
                
                log(`Respuesta HTTP: ${response.status} ${response.statusText}`);
                
                const responseText = await response.text();
                log(`Respuesta completa: ${responseText}`);
                
                if (response.ok) {
                    try {
                        const json = JSON.parse(responseText);
                        log(`JSON parseado: ${JSON.stringify(json, null, 2)}`);
                        
                        if (json.status === 'success') {
                            log('✅ Conexión exitosa');
                        } else if (json.status === 'error') {
                            log(`❌ Error del servidor: ${json.message}`, 'ERROR');
                        } else {
                            log(`⚠️ Respuesta inesperada: ${json.status}`, 'WARN');
                        }
                    } catch (e) {
                        log(`⚠️ Respuesta no es JSON válido: ${e.message}`, 'WARN');
                    }
                } else {
                    log(`❌ Error HTTP: ${response.status}`, 'ERROR');
                }
                
            } catch (error) {
                log(`❌ Error de conexión: ${error.message}`, 'ERROR');
                log(`Stack: ${error.stack}`, 'ERROR');
            }
        }
        
        async function paso3_crearFigura() {
            log('=== PASO 3: CREAR FIGURA DE PRUEBA ===');
            
            try {
                const figuraTest = {
                    SeccionOrden: '99',
                    OrdenFigura: '99',
                    Caption: 'TEST API - Figura de prueba completa',
                    RutaArchivo: 'img/test/api_test.png',
                    Fuente: 'Prueba API - ' + new Date().toLocaleString()
                };
                
                log(`Datos de la figura: ${JSON.stringify(figuraTest, null, 2)}`);
                
                const payload = {
                    action: 'CREATE_FIGURA',
                    docId: 'D01',
                    figura: figuraTest
                };
                
                log(`Payload completo: ${JSON.stringify(payload, null, 2)}`);
                
                const url = CONFIG.APPS_SCRIPT_URLS.FIGURAS;
                log(`Enviando a: ${url}`);
                
                const response = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify(payload)
                });
                
                log(`Respuesta HTTP: ${response.status} ${response.statusText}`);
                
                const responseText = await response.text();
                log(`Respuesta completa: ${responseText}`);
                
                if (response.ok) {
                    try {
                        const json = JSON.parse(responseText);
                        log(`JSON parseado: ${JSON.stringify(json, null, 2)}`);
                        
                        if (json.status === 'success') {
                            log('✅ Figura creada exitosamente');
                            log(`Mensaje: ${json.message}`);
                        } else {
                            log(`❌ Error al crear: ${json.message}`, 'ERROR');
                        }
                    } catch (e) {
                        log(`❌ Error parseando JSON: ${e.message}`, 'ERROR');
                    }
                } else {
                    log(`❌ Error HTTP: ${response.status}`, 'ERROR');
                }
                
            } catch (error) {
                log(`❌ Error en creación: ${error.message}`, 'ERROR');
                log(`Stack: ${error.stack}`, 'ERROR');
            }
        }
        
        async function paso4_verificarCreacion() {
            log('=== PASO 4: VERIFICAR QUE SE CREÓ LA FIGURA ===');
            
            try {
                log('Cargando todas las figuras desde Google Sheets...');
                
                const figuras = await cargarHojaCSV('Figuras');
                log(`Total de figuras encontradas: ${figuras.length}`);
                
                const figuraTest = figuras.find(f => 
                    f.DocumentoID === 'D01' && 
                    f.SeccionOrden === '99' && 
                    f.OrdenFigura === '99'
                );
                
                if (figuraTest) {
                    log('✅ Figura de prueba encontrada en Google Sheets');
                    log(`Datos: ${JSON.stringify(figuraTest, null, 2)}`);
                } else {
                    log('❌ Figura de prueba NO encontrada en Google Sheets', 'ERROR');
                    log('Figuras D01 encontradas:');
                    const figurasD01 = figuras.filter(f => f.DocumentoID === 'D01');
                    figurasD01.forEach(f => {
                        log(`  - Sec: ${f.SeccionOrden}, Ord: ${f.OrdenFigura}, Título: ${f.Caption}`);
                    });
                }
                
            } catch (error) {
                log(`❌ Error verificando: ${error.message}`, 'ERROR');
            }
        }
        
        async function paso5_actualizarFigura() {
            log('=== PASO 5: ACTUALIZAR FIGURA DE PRUEBA ===');
            
            try {
                const figuraActualizada = {
                    SeccionOrden: '99',
                    OrdenFigura: '99',
                    Caption: 'TEST API - Figura ACTUALIZADA',
                    RutaArchivo: 'img/test/api_test_updated.png',
                    Fuente: 'Prueba API ACTUALIZADA - ' + new Date().toLocaleString()
                };
                
                log(`Actualizando figura 99-99 con: ${JSON.stringify(figuraActualizada, null, 2)}`);
                
                const payload = {
                    action: 'UPDATE_FIGURA',
                    docId: 'D01',
                    figuraId: '99-99',
                    figura: figuraActualizada
                };
                
                log(`Payload: ${JSON.stringify(payload, null, 2)}`);
                
                const url = CONFIG.APPS_SCRIPT_URLS.FIGURAS;
                const response = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify(payload)
                });
                
                log(`Respuesta HTTP: ${response.status} ${response.statusText}`);
                
                const responseText = await response.text();
                log(`Respuesta: ${responseText}`);
                
                if (response.ok) {
                    const json = JSON.parse(responseText);
                    if (json.status === 'success') {
                        log('✅ Figura actualizada exitosamente');
                    } else {
                        log(`❌ Error: ${json.message}`, 'ERROR');
                    }
                }
                
            } catch (error) {
                log(`❌ Error actualizando: ${error.message}`, 'ERROR');
            }
        }
        
        async function paso6_eliminarFigura() {
            log('=== PASO 6: ELIMINAR FIGURA DE PRUEBA ===');
            
            try {
                const payload = {
                    action: 'DELETE_FIGURA',
                    docId: 'D01',
                    figuraId: '99-99'
                };
                
                log(`Eliminando figura 99-99`);
                log(`Payload: ${JSON.stringify(payload, null, 2)}`);
                
                const url = CONFIG.APPS_SCRIPT_URLS.FIGURAS;
                const response = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify(payload)
                });
                
                log(`Respuesta HTTP: ${response.status} ${response.statusText}`);
                
                const responseText = await response.text();
                log(`Respuesta: ${responseText}`);
                
                if (response.ok) {
                    const json = JSON.parse(responseText);
                    if (json.status === 'success') {
                        log('✅ Figura eliminada exitosamente');
                    } else {
                        log(`❌ Error: ${json.message}`, 'ERROR');
                    }
                }
                
            } catch (error) {
                log(`❌ Error eliminando: ${error.message}`, 'ERROR');
            }
        }
    </script>
</body>
</html>
