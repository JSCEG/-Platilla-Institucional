<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Figuras - SENER LaTeX</title>
    
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Estilos -->
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/bootstrap-overrides.css">
</head>
<body>
    <div class="container mt-5">
        <div class="row">
            <div class="col-12">
                <h1 class="text-center mb-4">
                    <i class="fas fa-image me-2 text-primary"></i>
                    Test de Figuras
                </h1>
                
                <div class="card mb-4">
                    <div class="card-header">
                        <h5 class="mb-0">
                            <i class="fas fa-cog me-2"></i>
                            Configuración de API
                        </h5>
                    </div>
                    <div class="card-body">
                        <div id="config-status">
                            <div class="text-center">
                                <div class="spinner-border text-primary" role="status">
                                    <span class="visually-hidden">Verificando...</span>
                                </div>
                                <p class="mt-2">Verificando configuración...</p>
                            </div>
                        </div>
                    </div>
                </div>
                
                <div class="card mb-4">
                    <div class="card-header">
                        <h5 class="mb-0">
                            <i class="fas fa-vial me-2"></i>
                            Pruebas de API
                        </h5>
                    </div>
                    <div class="card-body">
                        <div class="row">
                            <div class="col-md-4">
                                <button class="btn btn-primary w-100 mb-2" onclick="probarCargarFiguras()">
                                    <i class="fas fa-download me-1"></i>
                                    Cargar Figuras
                                </button>
                            </div>
                            <div class="col-md-4">
                                <button class="btn btn-success w-100 mb-2" onclick="probarCrearFigura()">
                                    <i class="fas fa-plus me-1"></i>
                                    Crear Figura Test
                                </button>
                            </div>
                            <div class="col-md-4">
                                <button class="btn btn-warning w-100 mb-2" onclick="probarActualizarFigura()">
                                    <i class="fas fa-edit me-1"></i>
                                    Actualizar Figura
                                </button>
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-md-6">
                                <button class="btn btn-danger w-100 mb-2" onclick="probarEliminarFigura()">
                                    <i class="fas fa-trash me-1"></i>
                                    Eliminar Figura Test
                                </button>
                            </div>
                            <div class="col-md-6">
                                <button class="btn btn-info w-100 mb-2" onclick="limpiarResultados()">
                                    <i class="fas fa-broom me-1"></i>
                                    Limpiar Resultados
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
                
                <div class="card">
                    <div class="card-header">
                        <h5 class="mb-0">
                            <i class="fas fa-clipboard-list me-2"></i>
                            Resultados
                        </h5>
                    </div>
                    <div class="card-body">
                        <div id="resultados">
                            <p class="text-muted">Los resultados de las pruebas aparecerán aquí...</p>
                        </div>
                    </div>
                </div>
                
                <div class="mt-4 text-center">
                    <a href="editor.html?id=D01" class="btn btn-primary me-2">
                        <i class="fas fa-edit me-1"></i>
                        Ir al Editor (D01)
                    </a>
                    <a href="index.html" class="btn btn-secondary">
                        <i class="fas fa-home me-1"></i>
                        Volver al Index
                    </a>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- Scripts necesarios -->
    <script src="js/config.js"></script>
    <script src="js/api.js"></script>
    <script src="js/bootstrap-init.js"></script>
    
    <script>
        // Variables globales para las pruebas
        let figuraTestId = null;
        
        // Ejecutar verificación automática al cargar
        document.addEventListener('DOMContentLoaded', async function() {
            console.log('🔍 Iniciando verificación de configuración...');
            await verificarConfiguracion();
        });
        
        async function verificarConfiguracion() {
            const statusDiv = document.getElementById('config-status');
            
            try {
                let html = '<h6 class="text-primary mb-3">📊 Estado de la Configuración:</h6>';
                
                // 1. Verificar CONFIG
                html += '<div class="mb-3">';
                html += '<strong>1. Configuración:</strong><br>';
                html += `<span class="badge ${typeof CONFIG !== 'undefined' ? 'bg-success' : 'bg-danger'}">`;
                html += `CONFIG: ${typeof CONFIG !== 'undefined' ? 'Cargado' : 'No cargado'}</span>`;
                if (typeof CONFIG !== 'undefined') {
                    html += `<br><small class="text-muted">URL Figuras: ${CONFIG.APPS_SCRIPT_URLS?.FIGURAS ? 'Configurado' : 'No configurado'}</small>`;
                }
                html += '</div>';
                
                // 2. Verificar API
                html += '<div class="mb-3">';
                html += '<strong>2. API:</strong><br>';
                html += `<span class="badge ${typeof api !== 'undefined' ? 'bg-success' : 'bg-danger'}">`;
                html += `API: ${typeof api !== 'undefined' ? 'Disponible' : 'No disponible'}</span>`;
                if (typeof api !== 'undefined') {
                    html += `<br><small class="text-muted">Modo: ${api.isGoogleAppsScript ? 'Google Apps Script' : 'Navegador'}</small>`;
                }
                html += '</div>';
                
                // 3. Probar conexión básica
                html += '<div class="mb-3">';
                html += '<strong>3. Conexión Google Sheets:</strong><br>';
                
                try {
                    if (typeof cargarHojaCSV === 'function') {
                        const figuras = await cargarHojaCSV('Figuras');
                        html += `<span class="badge bg-success">Conectado - ${figuras.length} figuras encontradas</span>`;
                        
                        if (figuras.length > 0) {
                            html += '<br><small class="text-muted">Ejemplo: ';
                            const ejemplo = figuras[0];
                            html += `${ejemplo.Caption || ejemplo.Titulo || 'Sin título'} (${ejemplo.DocumentoID || 'Sin ID'})`;
                            html += '</small>';
                        }
                    } else {
                        html += '<span class="badge bg-warning">Función no disponible</span>';
                    }
                } catch (error) {
                    html += `<span class="badge bg-danger">Error: ${error.message}</span>`;
                }
                html += '</div>';
                
                statusDiv.innerHTML = html;
                
            } catch (error) {
                statusDiv.innerHTML = `
                    <div class="alert alert-danger">
                        <i class="fas fa-exclamation-triangle me-2"></i>
                        <strong>Error en verificación:</strong> ${error.message}
                    </div>
                `;
            }
        }
        
        async function probarCargarFiguras() {
            agregarResultado('🔄 Cargando figuras desde Google Sheets...', 'info');
            
            try {
                const figuras = await cargarHojaCSV('Figuras');
                
                agregarResultado(`✅ Figuras cargadas: ${figuras.length} encontradas`, 'success');
                
                if (figuras.length > 0) {
                    const tabla = crearTablaFiguras(figuras.slice(0, 5)); // Mostrar solo las primeras 5
                    agregarResultado(tabla, 'info', true);
                    
                    if (figuras.length > 5) {
                        agregarResultado(`... y ${figuras.length - 5} más`, 'secondary');
                    }
                }
                
            } catch (error) {
                agregarResultado(`❌ Error al cargar figuras: ${error.message}`, 'danger');
            }
        }
        
        async function probarCrearFigura() {
            agregarResultado('🔄 Creando figura de prueba...', 'info');
            
            try {
                const figuraTest = {
                    SeccionOrden: '99',
                    OrdenFigura: '999',
                    Caption: 'Figura de prueba - Test API',
                    RutaArchivo: 'img/test/figura_prueba.png',
                    Fuente: 'Prueba automatizada - ' + new Date().toLocaleString()
                };
                
                const resultado = await api.crearFigura('TEST', figuraTest);
                
                if (resultado.status === 'success') {
                    figuraTestId = '99-999';
                    agregarResultado(`✅ Figura creada exitosamente: ${resultado.message}`, 'success');
                    agregarResultado(`ID asignado: ${figuraTestId}`, 'info');
                } else {
                    agregarResultado(`⚠️ Respuesta inesperada: ${resultado.message || 'Sin mensaje'}`, 'warning');
                }
                
            } catch (error) {
                agregarResultado(`❌ Error al crear figura: ${error.message}`, 'danger');
                console.error('Error completo:', error);
            }
        }
        
        async function probarActualizarFigura() {
            if (!figuraTestId) {
                agregarResultado('⚠️ Primero crea una figura de prueba', 'warning');
                return;
            }
            
            agregarResultado('🔄 Actualizando figura de prueba...', 'info');
            
            try {
                const figuraActualizada = {
                    SeccionOrden: '99',
                    OrdenFigura: '999',
                    Caption: 'Figura ACTUALIZADA - Test API',
                    RutaArchivo: 'img/test/figura_actualizada.png',
                    Fuente: 'Actualizada - ' + new Date().toLocaleString()
                };
                
                const resultado = await api.actualizarFigura('TEST', figuraTestId, figuraActualizada);
                
                if (resultado.status === 'success') {
                    agregarResultado(`✅ Figura actualizada: ${resultado.message}`, 'success');
                } else {
                    agregarResultado(`⚠️ Respuesta inesperada: ${resultado.message || 'Sin mensaje'}`, 'warning');
                }
                
            } catch (error) {
                agregarResultado(`❌ Error al actualizar figura: ${error.message}`, 'danger');
            }
        }
        
        async function probarEliminarFigura() {
            if (!figuraTestId) {
                agregarResultado('⚠️ Primero crea una figura de prueba', 'warning');
                return;
            }
            
            agregarResultado('🔄 Eliminando figura de prueba...', 'info');
            
            try {
                const resultado = await api.eliminarFigura('TEST', figuraTestId);
                
                if (resultado.status === 'success') {
                    agregarResultado(`✅ Figura eliminada: ${resultado.message}`, 'success');
                    figuraTestId = null;
                } else {
                    agregarResultado(`⚠️ Respuesta inesperada: ${resultado.message || 'Sin mensaje'}`, 'warning');
                }
                
            } catch (error) {
                agregarResultado(`❌ Error al eliminar figura: ${error.message}`, 'danger');
            }
        }
        
        function limpiarResultados() {
            document.getElementById('resultados').innerHTML = '<p class="text-muted">Los resultados de las pruebas aparecerán aquí...</p>';
        }
        
        function agregarResultado(mensaje, tipo = 'info', esHTML = false) {
            const resultadosDiv = document.getElementById('resultados');
            
            // Si es el primer resultado, limpiar el mensaje inicial
            if (resultadosDiv.innerHTML.includes('Los resultados de las pruebas aparecerán aquí')) {
                resultadosDiv.innerHTML = '';
            }
            
            const timestamp = new Date().toLocaleTimeString();
            const alertClass = `alert-${tipo}`;
            
            const div = document.createElement('div');
            div.className = `alert ${alertClass} alert-dismissible fade show`;
            div.innerHTML = `
                <small class="text-muted">[${timestamp}]</small><br>
                ${esHTML ? mensaje : escapeHtml(mensaje)}
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            `;
            
            resultadosDiv.appendChild(div);
            
            // Scroll al final
            resultadosDiv.scrollTop = resultadosDiv.scrollHeight;
        }
        
        function crearTablaFiguras(figuras) {
            let html = '<div class="table-responsive"><table class="table table-sm table-striped">';
            html += '<thead><tr><th>ID Doc</th><th>Sección</th><th>Orden</th><th>Título</th><th>Ruta</th></tr></thead>';
            html += '<tbody>';
            
            figuras.forEach(figura => {
                html += '<tr>';
                html += `<td><code>${figura.DocumentoID || 'N/A'}</code></td>`;
                html += `<td>${figura.SeccionOrden || 'N/A'}</td>`;
                html += `<td>${figura.OrdenFigura || 'N/A'}</td>`;
                html += `<td>${figura.Caption || figura.Titulo || 'Sin título'}</td>`;
                html += `<td><small><code>${figura.RutaArchivo || figura.Ruta || 'N/A'}</code></small></td>`;
                html += '</tr>';
            });
            
            html += '</tbody></table></div>';
            return html;
        }
        
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
    </script>
</body>
</html>
